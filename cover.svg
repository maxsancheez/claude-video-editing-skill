<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <rect width="1280" height="640" fill="#101218"/>
  <!-- motif: a waveform with silent gaps cut out, and a 9:16 frame with a caption -->
  <g transform="translate(80,420)">
    <g fill="#ff5a5f">
      <rect x="0" y="-30" width="10" height="60" rx="3"/>
      <rect x="18" y="-55" width="10" height="110" rx="3"/>
      <rect x="36" y="-40" width="10" height="80" rx="3"/>
      <rect x="54" y="-70" width="10" height="140" rx="3"/>
      <rect x="72" y="-35" width="10" height="70" rx="3"/>
      <rect x="90" y="-50" width="10" height="100" rx="3"/>
    </g>
    <g fill="#3a3f4b">
      <rect x="120" y="-3" width="90" height="6" rx="3"/>
    </g>
    <g fill="#ff5a5f">
      <rect x="230" y="-45" width="10" height="90" rx="3"/>
      <rect x="248" y="-65" width="10" height="130" rx="3"/>
      <rect x="266" y="-30" width="10" height="60" rx="3"/>
      <rect x="284" y="-55" width="10" height="110" rx="3"/>
      <rect x="302" y="-40" width="10" height="80" rx="3"/>
    </g>
    <g fill="#3a3f4b">
      <rect x="332" y="-3" width="70" height="6" rx="3"/>
    </g>
    <g fill="#ff5a5f">
      <rect x="422" y="-35" width="10" height="70" rx="3"/>
      <rect x="440" y="-60" width="10" height="120" rx="3"/>
      <rect x="458" y="-45" width="10" height="90" rx="3"/>
      <rect x="476" y="-25" width="10" height="50" rx="3"/>
    </g>
    <g stroke="#ff5a5f" stroke-width="3" stroke-dasharray="6 6">
      <line x1="165" y1="-90" x2="165" y2="90"/>
      <line x1="367" y1="-90" x2="367" y2="90"/>
    </g>
  </g>
  <g transform="translate(980,90)">
    <rect x="0" y="0" width="230" height="410" rx="22" fill="none" stroke="#e8e8ee" stroke-width="4"/>
    <rect x="16" y="35" width="198" height="250" rx="6" fill="#ff5a5f" opacity="0.14"/>
    <rect x="16" y="35" width="198" height="250" rx="6" fill="none" stroke="#ff5a5f" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="115" y="230" text-anchor="middle" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff" stroke="#000" stroke-width="1">cut the gaps</text>
    <circle cx="205" cy="320" r="8" fill="#e8e8ee" opacity="0.5"/>
    <circle cx="205" cy="350" r="8" fill="#e8e8ee" opacity="0.5"/>
    <circle cx="205" cy="380" r="8" fill="#e8e8ee" opacity="0.5"/>
  </g>
  <text x="80" y="150" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="#ffffff">Claude Video</text>
  <text x="80" y="230" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="#ffffff">Editing Skill</text>
  <text x="80" y="290" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="28" fill="#ff5a5f">Build · a markdown file, ffmpeg and Whisper</text>
